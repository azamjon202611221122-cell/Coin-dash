name: Build Coin Dash APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Extract game
        run: |
          unzip -o COIN-DASH-ANDROID-COMPLETE-SOURCE.zip -d extracted
          rm -rf extracted/coin-dash-complete-source/.github
          cp -a extracted/coin-dash-complete-source/. .

      - name: Install packages
        run: npm install

      - name: Prepare Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: COIN-DASH-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
